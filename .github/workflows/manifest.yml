name: Scriptlista frissítése
on:
   workflow_dispatch:                  
   push:
      paths: ["pythons/**"]
permissions:
   contents: write
jobs:
   manifest:
      runs-on: ubuntu-latest
      steps:       
         - uses: actions/checkout@v4
         - name: scripts.json generálása
           run: ls pythons/*.py | xargs -n1 basename | jq -R . | jq -s . > scripts.json
         - name: Commit, ha változott
           run: |
              git config user.name "github-actions"
              git config user.email "actions@users.noreply.github.com"
              git add scripts.json
              git diff --cached --quiet || (git commit -m "scripts.json frissítve" && git push)